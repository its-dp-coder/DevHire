services:
  db:
    image: postgres:16
    container_name: devhire-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devhire_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devhire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: devhire-api
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: production
      APP_NAME: DevHire API
      SECRET_KEY: devhire-docker-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/devhire_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/devhire_db
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: devhire-worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: production
      APP_NAME: DevHire API
      SECRET_KEY: devhire-docker-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/devhire_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/devhire_db
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: rq worker devhire
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: