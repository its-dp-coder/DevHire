name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devhire_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devhire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        env:
          APP_ENV: test
          APP_NAME: DevHire API
          SECRET_KEY: test-secret-key
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/devhire_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/devhire_test
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build
